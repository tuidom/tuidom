name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      # Граф пакетов собирается в V8-снапшот: на уровне модулей нет нативных объектов.
      - run: npm run check:snapshot
      # Топологическая сборка пакетов + npm pack + smoke шести tgz на голом node (deep-exports).
      - run: npm run pack
